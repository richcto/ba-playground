name: Deploy Kafka Config

on:
  workflow_dispatch:
    inputs:
      topic_name:
        description: "Topic name"
        required: true
        default: "ticket-purchases"
      partitions:
        description: "Number of partitions"
        required: true
        default: 3
        type: number
      adjust_partitions:
        description: "Adjust existing topic (skip duplicate check and catalog add)"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}

jobs:
  kafka_config:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for duplicate topic
        if: github.event.inputs.adjust_partitions != 'true'
        run: |
          topic="${{ github.event.inputs.topic_name || 'ticket-purchases' }}"
          if grep -q "name: $topic" backstage/catalog/kafka-topics.yaml 2>/dev/null; then
            echo "::error::Topic '$topic' already exists in catalog. Choose a different name or use Adjust Partitions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init (infra) - get bootstrap servers
        working-directory: infra
        run: terraform init

      - name: Get Kafka bootstrap servers
        id: kafka
        run: |
          bootstrap=$(cd infra && terraform output -raw kafka_bootstrap_servers 2>/dev/null || echo "")
          if [ -z "$bootstrap" ]; then
            echo "::error::kafka_bootstrap_servers output is empty. Deploy infra first (run deploy-infra workflow)."
            exit 1
          fi
          echo "bootstrap=${bootstrap}" >> $GITHUB_OUTPUT

      - name: Wait for Kafka
        run: |
          host=$(echo "${{ steps.kafka.outputs.bootstrap }}" | cut -d: -f1)
          port=$(echo "${{ steps.kafka.outputs.bootstrap }}" | cut -d: -f2)
          for i in $(seq 1 18); do
            if timeout 5 bash -c "echo >/dev/tcp/$host/$port" 2>/dev/null; then
              echo "Kafka is reachable"
              exit 0
            fi
            echo "Waiting for Kafka... ($i/18)"
            sleep 10
          done
          echo "::error::Kafka did not become reachable in 3 minutes"
          exit 1

      - name: Terraform Init (kafka)
        working-directory: kafka
        run: |
          topic_key=$(echo "${{ github.event.inputs.topic_name || 'ticket-purchases' }}" | tr '.' '-')
          terraform init -reconfigure -backend-config="key=ba-playground/kafka/${topic_key}.tfstate"

      - name: Terraform Apply (Kafka config)
        working-directory: kafka
        run: |
          topic_name="${{ github.event.inputs.topic_name || 'ticket-purchases' }}"
          partitions="${{ github.event.inputs.partitions || '3' }}"
          terraform apply -auto-approve -input=false \
            -var="topic_name=${topic_name}" \
            -var="partitions=${partitions}"

      - name: Add topic to catalog
        if: github.event.inputs.adjust_partitions != 'true'
        run: |
          topic="${{ github.event.inputs.topic_name || 'ticket-purchases' }}"
          cat << EOF | sed 's/^          //' >> backstage/catalog/kafka-topics.yaml

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${topic}
  title: ${topic}
  description: Kafka topic
  tags:
    - kafka
spec:
  type: kafka-topic
  owner: platform
  system: ba-playground
EOF

      - name: Commit and push catalog update
        if: github.event.inputs.adjust_partitions != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backstage/catalog/kafka-topics.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Add Kafka topic to catalog"
            git push
          fi

  kafka_config:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.kafka_config == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Get Kafka bootstrap servers
        id: kafka
        run: |
          bootstrap=$(terraform output -raw kafka_bootstrap_servers 2>/dev/null || echo "")
          if [ -z "$bootstrap" ]; then
            echo "::error::kafka_bootstrap_servers output is empty. Deploy EC2 first (run plan/apply without Kafka config)."
            exit 1
          fi
          echo "bootstrap=${bootstrap}" >> $GITHUB_OUTPUT

      - name: Wait for Kafka
        run: |
          host=$(echo "${{ steps.kafka.outputs.bootstrap }}" | cut -d: -f1)
          for i in $(seq 1 18); do
            if timeout 5 bash -c "echo >/dev/tcp/$host/9092" 2>/dev/null; then
              echo "Kafka is reachable"
              exit 0
            fi
            echo "Waiting for Kafka... ($i/18)"
            sleep 10
          done
          echo "::error::Kafka did not become reachable in 3 minutes"
          exit 1

      - name: Terraform Apply (Kafka config)
        env:
          TF_VAR_aws_account_id: ${{ env.AWS_ACCOUNT_ID }}
          TF_VAR_aws_role_name: ${{ env.AWS_ROLE_NAME }}
          TF_VAR_kafka_bootstrap_servers: ${{ steps.kafka.outputs.bootstrap }}
        run: terraform apply -auto-approve -input=false -var="kafka_bootstrap_servers=${{ steps.kafka.outputs.bootstrap }}"

  destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    runs-on: ubuntu-latest
    environment: apply
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_aws_account_id: ${{ env.AWS_ACCOUNT_ID }}
          TF_VAR_aws_role_name: ${{ env.AWS_ROLE_NAME }}
        run: terraform destroy -auto-approve -input=false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "__pycache__", "build", ".terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"lambdas/producer/main.py" = ["E501"]
"lambdas/consumer/main.py" = ["E501"]
